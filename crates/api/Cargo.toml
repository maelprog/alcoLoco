[package]
name = "api"
description = "HTTP entry point of alcoLoco, built on axum."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
# Timestamps on the wire: `DateTime<Utc>` serialises as ISO 8601 with the `Z`
# suffix, which is the project convention for every date crossing the API.
chrono = { version = "0.4.45", default-features = false, features = [
    "clock",
    "serde",
    "std",
] }
# Migrations and the default connection string, so the API never restates them.
db = { path = "../db" }
serde = { version = "1.0.228", features = ["derive"] }
# Connection pool shared by every handler. `uuid` and `chrono` are what let an
# identifier, a `timestamptz` and a `date` be bound and read back without an
# intermediate string; without them every profile column would travel as text.
sqlx = { version = "0.8.6", default-features = false, features = [
    "chrono",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
tokio = { version = "1.53.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "time",
] }
# Structured logs, whose level is part of the configuration this issue loads.
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# OpenAPI document generated from the handlers themselves, so it cannot drift
# from the code the way a hand-written document does.
# The `uuid` feature is what teaches the derive that an identifier is a string
# in `format: uuid`; without it every `Uuid` field would have to restate its own
# schema by hand, which is the drift this document exists to avoid.
utoipa = { version = "5.5.0", features = ["uuid"] }
# Identifiers: UUID v7 generated by the application, also used as the pagination
# cursor because v7 is time ordered (SPEC.md §10.0, no native uuidv7() in PG 16).
uuid = { version = "1.24.1", features = ["serde", "v7"] }

[dev-dependencies]
# Reads a response body back in the tests.
http-body-util = "0.1.3"
serde_json = "1.0.145"
# `ServiceExt::oneshot` drives the router in-process, without binding a socket.
tower = { version = "0.5.2", features = ["util"] }
