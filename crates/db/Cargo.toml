[package]
name = "db"
description = "PostgreSQL schema of alcoLoco: embedded migrations, migration runner and local development seed."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Migration runner: applies the SQL files of `migrations/`, records them in
# `_sqlx_migrations` and therefore makes a re-run a no-op.
sqlx = { version = "0.8.6", default-features = false, features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
# Async runtime required by sqlx.
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
# Identifiers: UUID v7 generated by the application (SPEC.md §10.0, no native
# uuidv7() in PostgreSQL 16).
uuid = { version = "1.24.1", features = ["v7"] }
